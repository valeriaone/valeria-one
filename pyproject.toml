[project]
name = "valeria-one"
version = "0.11.0"
description = "The back office for any business, in any country, on any channel."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Tadewan Pascua" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2.10",
  "alembic>=1.13", "pydantic>=2.9", "pyyaml>=6", "httpx>=0.27", "phonenumbers>=8.13",
  "babel>=2.16", "cryptography>=43", "argon2-cffi>=23", "jinja2>=3.1",
  "itsdangerous>=2.1", "python-multipart>=0.0.9", "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["valeria_one*"]

[tool.setuptools.package-data]
"valeria_one.packs" = ["countries/*.yaml", "industries/*.yaml"]
"valeria_one.web" = ["templates/*.html", "static/*"]
