; Keeps PostgreSQL, the Valeria One app and its background jobs running in one container.
; Child processes inherit supervisord's environment (VO_SECRET_KEY, VO_DATABASE_URL, VO_SIGNUP, PGBIN),
; which the entrypoint exports before exec'ing supervisord.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:postgres]
command=%(ENV_PGBIN)s/postgres -D /data/db
user=postgres
priority=10
autorestart=true
stopsignal=INT             ; fast, safe shutdown for PostgreSQL
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=uvicorn valeria_one.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips *
directory=/app
user=vo
priority=20
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:jobs]
command=python -m valeria_one.jobs loop
directory=/app
user=vo
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
