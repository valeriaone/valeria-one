{% extends "base.html" %}
{% block main %}
<div class="top"><div><h1>{{ _('website') }}</h1><p class="muted small" style="margin:4px 0 0">{{ _('site_intro') }}</p></div>
  {% if url and on %}<a class="btn fit" href="{{ url }}" target="_blank" rel="noopener">{{ _('preview') }}</a>{% endif %}</div>
<form method="post" action="/app/website" class="grid g2" style="align-items:start">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="card">
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="enabled" value="1" {{ 'checked' if on }} style="width:auto"> {{ _('site_on') }}</label>
    {% if url and on %}<label>{{ _('site_link') }}</label><code class="key"><a href="{{ url }}" target="_blank" rel="noopener">{{ url }}</a></code>{% endif %}
    <label>{{ _('headline') }}</label><input name="headline" value="{{ s.headline or '' }}" maxlength="120" placeholder="{{ label(industry.name) }}">
    <label>{{ _('about') }}</label><textarea name="about" maxlength="2000" style="min-height:140px">{{ s.about or '' }}</textarea>
    <label>{{ _('photo_url') }}</label><input name="photo_url" value="{{ s.photo_url or '' }}" maxlength="500">
    <label>{{ _('color') }}</label><input name="color" type="color" value="{{ s.color or '#4d5bff' }}" style="height:42px;padding:4px">
  </div>
  <div class="card">
    <label>WhatsApp</label><input name="whatsapp" value="{{ s.whatsapp or '' }}" inputmode="tel" placeholder="+{{ country.phone_cc }}">
    <label>Instagram (@)</label><input name="instagram" value="{{ s.instagram or '' }}" maxlength="200">
    <label>Facebook</label><input name="facebook" value="{{ s.facebook or '' }}" maxlength="200" placeholder="https://facebook.com/…">
    <label>{{ _('public_phone') }}</label><input name="phone" value="{{ s.phone or '' }}" inputmode="tel">
    <label>{{ _('public_email') }}</label><input name="email" type="email" value="{{ s.email or '' }}">
    <label>{{ _('address') }}</label><input name="address" value="{{ s.address or '' }}" maxlength="300">
    <label>{{ _('map_url') }}</label><input name="map_url" value="{{ s.map_url or '' }}" maxlength="500">
    <p><button class="btn primary">{{ _('save') }}</button></p>
  </div>
</form>
{% endblock %}
