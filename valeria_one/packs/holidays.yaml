# Holidays and days that matter to small businesses, per country, for Valeria's holiday autopilot
# (services/holidays.py): 7 days before, she offers the owner a post and an optional offer.
#
# How a date is given (one of):
#   fixed: "MM-DD"                                  the same day every year
#   nth: {month: 5, weekday: sun, n: 2}             2nd Sunday of May (n: -1 = the last one); plus: days after it
#   easter: -2                                      days from Western Easter Sunday (computed: Gregorian algorithm)
#   dates: {2026: "2026-03-20", …}                  listed, for lunar calendars (2026–2028)
# approx: true = the date depends on the moon being sighted (Islamic calendar) or on a local almanac (Hindu
# calendar): it can move by a day; Valeria says "around" and the owner checks it.
#
# Sources (where each date comes from; re-check the listed lunar dates each year): official public-holiday lists of each government (Mexico: Ley Federal del Trabajo
# art. 74; Philippines: Proclamation for 2026 regular holidays; India: Ministry of Personnel gazetted holidays;
# United States: 5 U.S.C. 6103; UAE: Cabinet resolution on official holidays; Pakistan: Cabinet Division
# notifications; Nigeria: Public Holidays Act; Indonesia: SKB 3 Menteri hari libur nasional; Brazil: Lei
# 10.607/2002 and Lei 6.802/1980), timeanddate.com and officeholidays.com for the moveable and lunar dates,
# drikpanchang.com for Holi and Diwali, and the Umm al-Qura calendar for the Islamic dates (approx).
# Commercial days that are not public holidays (Mother's Day, Valentine's, Black Friday…) are the usual dates in
# each country. Countries not listed get the global days only.

